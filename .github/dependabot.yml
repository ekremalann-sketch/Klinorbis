version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '07:20'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:40'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
