name: Klinorbis source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: klinorbis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build and test
        run: npm test

      - name: Install Turkey core dependencies
        if: hashFiles('core/package-lock.json') != ''
        run: npm ci --prefix core
      - name: Turkey core types and PostgreSQL semantics
        if: hashFiles('core/package-lock.json') != ''
        run: npm run typecheck --prefix core && npm test --prefix core
