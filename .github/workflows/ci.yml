name: Klinorbis source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: klinorbis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build and test
        run: npm test

      - name: Install Turkey core dependencies
        if: hashFiles('core/package-lock.json') != ''
        run: npm ci --prefix core
      - name: Turkey core types and PostgreSQL semantics
        if: hashFiles('core/package-lock.json') != ''
        run: npm run typecheck --prefix core && npm test --prefix core
