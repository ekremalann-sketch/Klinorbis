name: Repository security
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned MIT-licensed Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/security-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-tools" gitleaks
      - name: Scan reachable Git history with redaction
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact=100 --no-banner --log-level=error --log-opts="--all" --exit-code=10 --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" .
          result=$?
          set -e
          if [ "$result" -eq 10 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'gitleaks.json'), 'utf8'));
          const safe = value => String(value ?? '').replace(/[\r\n|<>]/g, ' ').slice(0, 200);
          const rows = report.slice(0, 50).map(item => '| ' + [item.RuleID, item.File, item.StartLine, /^[a-f0-9]{40,64}$/.test(item.Commit) ? item.Commit.slice(0, 12) : ''].map(safe).join(' | ') + ' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## İncelenecek gizli bilgi adayları: ' + report.length + '\nYalnız konum bilgisi; gerçek sır olduğu henüz doğrulanmadı. İlk 50 kayıt.\n\n| Kural | Dosya | Satır | Commit |\n|---|---|---|---|\n' + rows.join('\n') + '\n');
          NODE
          fi
          exit "$result"
      - name: Record outcome without secret values
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          printf '## Gizli bilgi taraması\nSonuç: %s\n' "$SCAN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Başarısız veya atlanmış kontrol temiz sonuç değildir. Ham bulgu dosyası yayımlanmaz. Olası sızıntıda anahtar değişimi ayrı insan onayı gerektirir.' >> "$GITHUB_STEP_SUMMARY"
